name: Live API connection

on:
  pull_request:
    branches: [main]
    paths:
      - config.js
      - scripts/check-live-api.mjs
      - .github/workflows/live-api.yml
  push:
    branches: [main]
    paths:
      - config.js
      - scripts/check-live-api.mjs
      - .github/workflows/live-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    name: Check deployed Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify public API without creating student records
        run: node scripts/check-live-api.mjs
