name: Two lesson browser checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Build and start synthetic-only services
        run: |
          npm run build
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/static.log 2>&1 &
          node qa/lesson4-fixture.mjs > /tmp/fixture.log 2>&1 &
      - name: Test student groups and teacher lesson controls
        run: node qa/lesson4-browser.mjs
      - name: Keep synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson4-browser
          path: artifacts/lesson4-browser/
          if-no-files-found: ignore
          retention-days: 3
